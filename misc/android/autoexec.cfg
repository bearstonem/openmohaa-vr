// Deploy with:
//
//   adb push misc/android/autoexec.cfg \
//     /sdcard/Android/data/org.openmoh.openmohaa/files/main/autoexec.cfg
//   adb shell am force-stop org.openmoh.openmohaa
//
// Then launch from inside the headset. Never adb shell am start.
//
// Not packaged into the APK - it goes next to the game data, which is where the
// filesystem looks for it. Reinstalling the APK keeps it; clearing app data or
// reflashing the game files loses it, which is why it lives here.
//
// autoexec.cfg is exec'd after omconfig.cfg, cannot be loaded from a pk3, and
// lands before R_Init - so it beats both the stored config and the renderer's
// own defaults, latched and archived cvars included. It is the only way to set
// a cvar on a device with no console. See docs/markdown/04-coding/04-gl4es.md.

// Where the weapon model sits in the hand:
//
//     scale, right, up, forward, pitch, yaw, roll
//
// The view model is authored to sit at the camera with the arms reaching
// forward, so putting its origin at the controller leaves that built-in offset
// in place. This takes it back out. Right/up/forward are in engine units along
// the weapon's own axes after any rotation correction, so they mean what they
// say however the gun is pointing.
//
// To dial it in: push a new value, force-stop, relaunch. No rebuild needed.
// Negative forward pulls the model back towards you, negative up drops it,
// negative right moves it to the off hand's side.
//
// The reference keeps one of these per weapon (vr_weapon_adjustment_<id>);
// this is a single global one until the numbers for each are known.
// The offsets are back to zero: the -10 right and -6 up were pulling the model
// back from an origin anchored on the model itself, and the weapon is now
// anchored on tag_weapon_right, so the gun's own attachment point lands on the
// controller and there is nothing left for those to cancel. Retune from here
// rather than from the old numbers.
//
// The roll is not zero, and is not a fudge. Anchoring forces the *bone* to take
// the controller's orientation, and a wrist bone's local axes do not run the way
// a controller is held - the mesh inherits that mismatch as a constant twist.
// 180 is the first thing to try because upside down is what a half turn about
// the aim axis looks like. If the model ends up on its side instead, the
// mismatch is in pitch or yaw; those are the two fields before this one.
set vr_weaponAdjust "1,0,0,0,0,0,180"

// The same seven fields for the hand that is not holding the weapon, which is
// drawn as a second copy of the view model on the off hand's controller.
//
// The offsets are zero because this hand is anchored on its own bone
// (Bip01 L Hand, measured 26.7 units out from the model origin), so there is no
// built-in offset left to cancel - only the wrist's own rotation convention,
// which is what the roll is for. Same reasoning as the weapon above.
//
// The two hands are mirrored, so do not assume the correction is identical:
// if one comes out right at 180 and the other is still wrong, try -180 here.
//
// If the hand is nowhere near the controller rather than merely turned, read the
// log instead of tuning: the candidate lines name every anchor considered and
// how far out it sits, which says whether the bone was found at all.
set vr_offHandAdjust "1,0,0,0,0,0,180"

// How many game units make a metre. Not a feel value - it is this game's own
// scale, and getting it wrong makes everything measured against the player the
// wrong size.
//
// MOHAA's art is authored at 16 units per foot; its tik files say so where they
// convert from centimetres (models/weapons/bar.tik: "16/30.5 since world is in
// 16 units per foot"). 16 / 0.3048 = 52.5, and the player dimensions agree -
// MAXS_Z 94 and DEFAULT_VIEWHEIGHT 82 are 1.79 m standing, 1.56 m to the eye.
//
// This is set here as well as changed in code because vr_worldscale is
// CVAR_ARCHIVE: the value already stored in omconfig.cfg wins over any new
// default, so a code change alone would do nothing on a device that has run
// before.
set vr_worldscale 52.5

// How long the weapon hand grip may be held and still count as a tap for
// reload, rather than being ignored.
set vr_reloadTapMs 400

// Dumps the left eye to main/vrshotN.tga every two seconds. Pull them one at a
// time - pulling the directory drags the pk3s with it.
// The per frame timing report is three lines a second, which rolls anything
// useful out of logcat within a minute or two. Off while hunting anything that
// prints once.
set vr_traceFrame 0

set vr_captureEye 0

// One line per use press, naming which of the three ways it can come up empty
// actually happened: the body's eye, the eye the trace really started from
// after the play space offset, how far the trace got, and what the box at the
// end of it caught. A press that prints nothing never reached the game at all,
// which points at the binding rather than at the reach.
set vr_traceUse 1

// Weapons live on the body: reach to a hip or over a shoulder and squeeze the
// grip to draw, the way Half-Life: Alyx does it. Right hip is the pistol, left
// hip grenades, and the long guns are slung over the shoulders - rifle right,
// smg left. Either hand can draw from any of them.
set vr_holsters 1

// One line per grip squeeze, giving where the hand was relative to the head
// when it closed and which zone that landed in - or "nothing", which is the
// interesting case. The zone boxes in vr_openxr.c are a first guess at where
// people actually reach; this is how to replace them with measurements.
set vr_traceHolster 1

// One line per upload of the dynamic lightmap - which is how a muzzle flash or
// an explosion lights the world in this engine: it rewrites the lightmap of
// every surface the light reaches rather than adding a pass over them.
//
// At 1, "patch peak" is the brightest texel uploaded, out of 765. Measured on
// the device: peak 548, over half the texels lit, no GL error. So the patch the
// CPU builds is bright and it reaches GL without complaint, and whatever turns
// the walls black is downstream of both.
//
// At 2 it stops measuring and starts staining: the whole atlas goes white
// before the front end touches it, and every texel a light reaches is painted
// magenta over the top. Read off the walls, not out of the log. White can only
// brighten, so anything reading the atlas outside a written patch is
// unmissable. A dark green stain was tried first and was useless in a level
// made of hedgerows.
//
// 3 additionally skips ProjectDlightTexture, Quake 3's second-pass dynamic
// light. Measured: it never runs here, so this changes nothing.
//
// Off, because none of it is needed to play. Turn it on to resume the hunt.
set vr_traceDlight 0

// The world does not respond to dynamic lights. This is a workaround for an
// unsolved bug and not a preference: a muzzle flash makes the ground about
// four times *darker* rather than lighting it, over roughly a sixth of the
// screen, for as long as the trigger is held. Losing flashes lighting the
// scenery is the smaller loss.
//
// Lights still exist and still light models and sprites - only the world's
// lightmap is left alone. Set it back to 1 to see the bug.
//
// docs/markdown/04-coding/05-dlights.md has the measurements, the seven
// theories that were wrong, and where to pick it up.
set r_worldDlights 0

// One line per throw: the peak speed of the swing and the direction it was
// going, in the play space's own frame. The scale and clamp applied to that in
// weapon.cpp are guesses about how hard a person throws in a living room, and
// this is what replaces them with a measurement.
set vr_traceThrow 1

// Grenade throwing, all four archived - which is exactly why they are set here
// as well as defaulted in code. An archived cvar keeps whatever omconfig.cfg
// already has, so changing a default in the source does nothing at all on a
// device that has run before. That trap cost a build here: the floor stayed at
// its old 0.45 while the curve moved under it, and every throw came out
// clamped to the same 45% regardless of how hard it was thrown.
//
//   vr_throwFull   hand speed, in units a second, counting as a full throw.
//                  Measured: hard overhand 278-338, gentle lob 145-192.
//   vr_throwCurve  above 1 bends the gentle end down without touching the top,
//                  which is what stops a 45 degree lob outrunning a flat throw.
//   vr_throwMin    floor, so a polite swing still leaves the hand.
//   vr_throwDamp   how much of the sideways drift to take out of a slow throw,
//                  scaled by how gentle it is. 0 is honest physics and throws
//                  lobs where the arm actually went, which is not where the
//                  player meant. The only deliberate lie in here.
set vr_throwFull 340
set vr_throwCurve 1.5
set vr_throwMin 0.2
set vr_throwDamp 0.8

// --- weapon test harness ---
//
// Playing through to wherever the game hands over a gun, on every build, is not
// a workable way to tune weapon alignment. There is no console in a headset to
// type "give" into either, and autoexec runs before there is a map - let alone
// a player to give anything to.
//
// All three are off on purpose. Filled in, they skip the game: cheats on,
// every weapon handed over, and a map loaded straight past the menu. That is a
// harness for tuning alignment, not how anyone should be handed the game.
//
//   set cheats 1
//   set vr_testStart "give all"
//   set vr_startMap "m4l1"
//
// Each needs its own timing, which is why they are three cvars and not one.
// vr_testStart runs once, a second and a half after the player is actually in
// the world - autoexec is far too early, there is no map yet, let alone a
// player to give anything to. vr_startMap waits until the client is sitting
// idle at the menu, because a map loaded from autoexec is torn back down by the
// game's own startup.
set cheats 1
set vr_testStart "give all"

// Drop straight into a map on launch. Empty is the menu, which is how the game
// is meant to start.
//
// Not "map m4l1" directly: autoexec runs during Com_Init, and the game's own
// startup - the intro stages, then the menu - comes afterwards and tears any
// map loaded here straight back down. This waits until the client is sitting
// idle at the menu and then loads it.
//
// m4l1 is the weapon test map, chosen off the game's own data rather than by
// reputation:
//
//   - its script calls itself THE BOCAGE, and it opens on the Normandy
//     hedgerows with Manon, who is spawned with her AI disabled and set
//     nodamage - so nothing is shooting at you while you look at your hands;
//   - it has 2 spawn references in 538 lines of script, against m1l1's crowd
//     and m1l2a's 59 in 3660. Nearly nothing is scripted to happen at the
//     start;
//   - global/loadout.scr hands the player a colt45 and an m1_garand and selects
//     the rifle, so there is a weapon in hand at spawn without waiting for one.
//
// That last point is what makes it the right map for the hands specifically:
// the Garand is the weapon that swaps the left hand surface to "garandhand",
// so this level exercises both hand meshes rather than just the common one.
// Switch to the pistol to see the other.
set vr_startMap "m4l1"
